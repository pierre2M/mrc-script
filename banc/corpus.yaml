# Banc d'essai du pilote C (phase 3.3). Les pièces restent HORS du dépôt public (décision D6, 09/10/2026 : accès
# restreint) : citées ici par chemin et sha256, elles sont versées au dépôt privé `mrc-banc-prive`, ouvert en lecture
# à des vérificateurs désignés (tools/constituer_prive.py, tools/verifier_prive.py).
# statut : a_constituer · constitue (source prête) · fictif (source complétée d'une pièce fictive déclarée) ·
#          synthetique (essai de chaîne, hors métriques).
# Méthode (09/10/2026) : validation explicite — pas d'annotation de référence ; le validateur examine chaque
# écriture proposée (fiche de lecture, questions à l'agent d'explicitation) et la valide, demande une précision
# ou la refuse.
# espace : depot (fichiers dans ce dépôt) · local (fichiers dans le dossier MRC du porteur, sous banc_pilote_C/ :
#          source, propositions, registre, journaux ; `tools/banc.py --mrc <dossier MRC>`). Les cas locaux ne
#          publient dans banc/SUIVI.md que leur statut, jamais leurs montants ni leurs motifs.
