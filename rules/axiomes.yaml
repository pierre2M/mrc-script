axiomes:
  - id: "AX-2"
    status: axiom
    intitule: "Dette non soldable"
    enonce: "Les obligations nées de la dépendance à des processus non créés et non maîtrisés sont héritées collectivement, se renouvellent à chaque cycle et ne se soldent par aucun transfert, faute de créancier apte à donner quittance"
    refutation: "Un dispositif ne connaissant que des créances exigibles qui porte durablement une telle obligation sans la convertir ni la déclarer acquittée ; ou un solde par transfert avec quittance d'un créancier apte"
    theoremes_lies: ["une_dette_A2_ne_s_eteint_jamais", "le_quart_lemme_est_le_regime_de_A2"]
  - id: "AX-3"
    status: axiom
    intitule: "Découplage du sauvetage et de la répartition"
    enonce: "Face à un péril commun, la décision de l'action et la règle de répartition de sa charge peuvent être confiées à deux acteurs distincts, la seconde posée a priori. Sans cette séparation, l'action se bloque sur l'arbitrage entre efficacité et équité"
    refutation: "La séparation ne produit aucune différence observable sur les décisions, les contributions ou l'acceptabilité"
    theoremes_lies: ["sans_mandat_borne_aucune_repartition", "l_avarie_qualifiee_ne_suffit_pas", "le_repartiteur_non_nomme_ne_decouple_pas"]
  - id: "AX-9"
    status: axiom
    intitule: "Conflit et permanence"
    enonce: "Une institution dure en instituant le conflit et en revenant à son principe. Une autorité d'exception n'est compatible avec la durée que bornée dans le temps par un porteur autre que son bénéficiaire"
    refutation: "Des institutions durables ayant supprimé le conflit, ou une durée sans corrélation avec le retour au principe. Condition empirique, non testée par le corpus"
    theoremes_lies: ["sans_mandat_borne_aucune_repartition", "PR12_ne_qualifie_aucune_dette"]
  - id: "AX-7"
    status: axiom
    intitule: "Seuil arrêté par les concernés"
    enonce: "Il existe des dispositifs (TZCLD ; SSA/Roubaix) où les critères du seuil sont arrêtés par une instance ouverte aux concernés et composée d'eux"
    refutation: "Péremption si les dispositifs cessent ; réfutation sur pièces. **Posé ; constat documenté** : dossier de preuve constitué (axiome de référence : `Fiche_Axiome_A7_Seuil_Arrete_Par_Les_Concernes_2026-09-11` ; examen Roubaix, pièces `TZCLD/`, `RADIS/`), qui ne vaut pas preuve Lean. **Appui doctrinal, non garantie** ; en tension déclarée avec RSO-6"
    theoremes_lies: ["seul_debiteur_bien_forme_mais_marque", "la_ratification_ne_fonde_pas_le_registre"]
  - id: "AX-15"
    status: axiom
    intitule: "Rapprochement banque / client"
    enonce: "Au titre de l'inventaire (C. com. L.123-12 ; PCG art. 1021-3), l'entreprise et sa banque tiennent chacune le compte de l'autre : mêmes opérations, sens opposé ; l'écart est normal ; à la clôture, un état de rapprochement nomme les opérations manquantes de chaque côté"
    refutation: "Péremption si l'obligation d'inventaire disparaît, ou si le compte de l'entreprise n'est qu'une copie du relevé. Tombe comme ancrage de N2 si les deux registres ne sont pas tenus indépendamment"
    theoremes_lies: []
  - id: "AX-4"
    status: axiom
    intitule: "Mobilisabilité"
    enonce: "Visible, convocable, opposable et reprenable sont quatre états qui ne s'impliquent pas l'un l'autre"
    refutation: "Un dispositif où la visibilité suffit à l'opposabilité et à la reprise"
    theoremes_lies: []
  - id: "AX-14"
    status: axiom
    intitule: "L'objectivité tient à la critique transformatrice (Longino 1990)"
    enonce: "L'objectivité d'une connaissance tient au degré auquel la communauté qui la produit permet la critique transformatrice de ses données, méthodes et présupposés ; quatre conditions : voies reconnues de critique, standards partagés, réponse de la communauté, égalité de l'autorité intellectuelle"
    refutation: "Tombe, pour l'usage du MRC, si l'on documente un dispositif dont les inscriptions sont durablement contestées et effectivement corrigées sans qu'aucun tiers non partie n'ait accès à la contestation ni à ses règles. **Valable sous conditions déclarées ; transposition déclarée**"
    theoremes_lies: ["refutation_exige_un_tiers", "refutation_exige_un_lieu", "refutation_exige_une_reprise", "PR16_alterite_temoin_discriminant", "PR16_moyens_temoin_discriminant", "PR16_reprise_temoin_discriminant"]
