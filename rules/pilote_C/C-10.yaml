refutation: (1) CONV-16 tombe si l'on documente un dispositif d'écriture duale entre registres de communalité où
  l'arbitrage des écarts par une instance non désignée par l'une des parties est accepté par les deux et tenu dans la
  durée. (2) La séparation instance / formation tombe si la seule présence des parties dans l'instance, récusées pour
  l'arbitrage, ruine la légitimité des arbitrages rendus par les autres membres (Annexe §A.15.12).
