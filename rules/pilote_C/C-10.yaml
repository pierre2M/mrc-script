  nom: instanceCommune
  role: definition_executee
encodage: '∃ t, `instanceCommune ds a b t`, sur les désignations déclarées. Le pilote C évalue le cas d''une instance réduite à une seule entité, qui est sa propre formation d''arbitrage (PR-60, `pr43_est_le_cas_d_une_instance_a_un_seul_membre`) ; la composition d''une instance inclusive n''est pas encore représentée dans le schéma (`designations_controle`).'
