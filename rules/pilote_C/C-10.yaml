id: C-10
titre: Instance de contrôle commune (CONV-16)
status: convention
perimetre: noyau
application: Quand au moins un côté est un registre de communalité.
enonce: Le tiers d'une écriture duale est l'instance de contrôle désignée par les deux registres, par une désignation
  arrêtée ; sa composition est inclusive (elle peut compter A et B). Seule sa formation d'arbitrage — les membres ni A
  ni B, non liés — tranche un écart. À défaut d'instance commune ou de formation, l'écart reste inscrit et n'est pas
  arbitrable (CONV-16 révisée, décision n° 62 du 10/11/2026).
