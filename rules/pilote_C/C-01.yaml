id: C-01
titre: 'Ancrage de l''écriture duale : deux teneurs, un ancrage déclaré par côté'
status: theorem
nature: A
perimetre: noyau
application: Toujours, sur le couple des deux registres.
enonce: 'Les deux registres sont tenus par des teneurs identifiés et distincts, et chaque côté porte son ancrage
  déclaré : `traduction_uri_ref` (comptabilité tenue) ou `inscription_communalite_uri_ref` (registre de communalité),
  indifféremment. Le registre de communalité est une modalité d''ancrage pour les entités ou concernés sans comptabilité
  admise (décision du porteur D7, 07/10/2026).'
