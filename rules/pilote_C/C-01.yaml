refutation: L'élargissement D7 tombe si l'on établit, pour un couple de registres dont l'un au moins n'est pas une
  comptabilité tenue, qu'aucun état de rapprochement contrôlable ne peut être établi entre eux (NT-ARCH §8.5.0,
  condition proposée, à confirmer par le porteur).
owner: P. M., porteur du registre pilote
horizon: institutionnel, révisable (NT-ARCH §8.5.0)
critere_verification: 'Deux comptabilités tenues, une comptabilité et un registre de communalité, deux registres
  de communalité : ancrés. Un côté sans ancrage : refusé.'
affichage: Condition démontrée sur sa forme (PR-31) ; le défaut produit un refus.
reserve: 'Ce que la règle ne contrôle pas : les exigences propres au financement écologique (affectation des financements,
  engagements, réalisation) restent distinctes du contrôle général d''ancrage. L''homologie bancaire n''assimile
  pas l''engagement écologique à une dette financière et ne confère aucun pouvoir d''émission monétaire (NT-ARCH
  §8.5.0, D7).'
