  role: definition_executee
encodage: '`ancreeDuale ⟨teneur_A, ⟨traduction_A, communalite_A⟩⟩ ⟨teneur_B, ⟨traduction_B, communalite_B⟩⟩` ; par
  côté, `ancree ⟨traduction, communalite⟩` nomme le côté en défaut.'
