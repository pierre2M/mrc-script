id: C-07
titre: 'Registre du milieu : déclaration des concernés'
status: theorem
nature: A
perimetre: noyau
application: Quand un registre porte `registre_du_milieu`.
enonce: 'Le registre d''un milieu ou d''un collectif n''est opposable dans l''écriture duale que si la déclaration
  des concernés est arrêtée par eux (AX-7), non vide, porte un critère d''inclusion, un interprète, une date de
  réexamen non échue, et si l''écrivant est admissible (un milieu n''écrit pas son registre). Le registre n''est
  opposable que si, en outre, le maintien est structuré (C-08) ; sinon l''écart envers le titulaire reste inscrit.
  Phase 1 : le registre du milieu est le côté B, et son teneur est le titulaire.'
