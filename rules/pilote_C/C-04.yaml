perimetre: noyau
application: Toujours, après C-01 à C-03.
enonce: 'L''état de rapprochement nomme, dans chaque sens, les lignes sans miroir chez l''autre teneur. L''écriture
  duale est vraie si et seulement si les deux colonnes sont vides. Un écart n''est pas un défaut du dossier (D-ED-3)
  : il est porté dans l''état de rapprochement.'
