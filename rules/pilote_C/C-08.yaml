id: C-08
titre: Maintien structuré (CONV-11)
status: convention
perimetre: noyau
application: Quand un registre porte `registre_du_milieu`.
enonce: Le registre du milieu porte un maintien structuré — porteur, contrepartie, registre, situation (dû, payé),
  horizon, critère — et ce maintien nomme le registre du titulaire. Le solde est calculé (dû − payé), jamais déclaré.
